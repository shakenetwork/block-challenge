<script>
/* ============================================================
   PIECE DEFINITIONS — 16 shapes across 4 colors
   Each piece defined by relative cell positions (row, col)
   ============================================================ */
const COLOR_HEX = { red:'#ff6b6b', yellow:'#ffd93d', blue:'#6bcbff', green:'#6bff6b' };
const COLOR_GLOW = { red:'rgba(255,107,107,0.4)', yellow:'rgba(255,217,61,0.4)', blue:'rgba(107,203,255,0.4)', green:'rgba(107,255,107,0.4)' };

const PIECE_DEFS = {
  red: [
    { cells: [[0,0]], name: '单格' },
    { cells: [[0,0],[0,1],[0,2],[0,3]], name: 'I一字' },
    { cells: [[0,0],[0,2],[1,0],[1,1],[1,2]], name: 'U凹槽' },
    { cells: [[0,0],[1,0],[2,0],[2,1],[2,2]], name: 'V大拐' },
  ],
  yellow: [
    { cells: [[0,0],[0,1]], name: '双格' },
    { cells: [[0,0],[0,1],[0,2],[1,2]], name: 'L拐角' },
    { cells: [[0,0],[1,0],[1,1],[2,1],[2,2]], name: 'W阶梯' },
    { cells: [[0,1],[1,0],[1,1],[1,2],[2,1]], name: 'X十字' },
  ],
  blue: [
    { cells: [[0,0],[0,1],[0,2]], name: '三连横' },
    { cells: [[0,0],[0,1],[0,2],[1,1]], name: 'T字' },
    { cells: [[0,0],[0,1],[1,1],[1,2]], name: 'Z折线' },
    { cells: [[0,0],[0,1],[0,2],[1,1],[2,1]], name: 'T长柄' },
  ],
  green: [
    { cells: [[0,0],[1,0],[1,1]], name: 'L三连' },
    { cells: [[0,0],[0,1],[1,0],[1,1]], name: '田字' },
    { cells: [[0,1],[0,2],[1,0],[1,1],[2,1]], name: 'F异形' },
    { cells: [[0,0],[0,1],[0,2],[0,3],[1,0]], name: 'L长柄' },
  ],
};

// Fast lookup
const PIECE_LOOKUP = {};
for (const [color, defs] of Object.entries(PIECE_DEFS)) {
  for (const d of defs) {
    PIECE_LOOKUP[color+':'+d.name] = d;
  }
}

function getDef(color, name) {
  return PIECE_LOOKUP[color+':'+name];
}

/* ============================================================
   Piece class
   ============================================================ */
class Piece {
  constructor(color, cells, name) {
    this.color = color;
    this._cells = cells.map(c => [...c]);
    this.cells = cells.map(c => [...c]);
    this.name = name;
  }
  rotate() {
    const rotated = this.cells.map(([r,c]) => [c, -r]);
    const minR = Math.min(...rotated.map(([r]) => r));
    const minC = Math.min(...rotated.map(([_,c]) => c));
    this.cells = rotated.map(([r,c]) => [r - minR, c - minC]);
  }
  get width() { return Math.max(...this.cells.map(([_,c]) => c)) + 1; }
  get height() { return Math.max(...this.cells.map(([r]) => r)) + 1; }
}

/* ============================================================
   LEVELS — designed by placing pieces on the grid (guaranteed solvable)
   Each level: { pieces: [{color, name}], map: 8x8 }
   ============================================================ */
const GRID = 8;

// Helper: generate map from placed piece definitions
// placed = [{color, name, row, col, rotation}]
function genLevel(placed) {
  const map = Array.from({length: GRID}, () => Array(GRID).fill(0));
  for (const pd of placed) {
    const def = getDef(pd.color, pd.name);
    const piece = new Piece(pd.color, def.cells.map(c => [...c]), pd.name);
    for (let r = 0; r < pd.rotation; r++) piece.rotate();
    for (const [pr, pc] of piece.cells) {
      const ar = pd.row + pr, ac = pd.col + pc;
      if (ar >= 0 && ar < GRID && ac >= 0 && ac < GRID) map[ar][ac] = 1;
    }
  }
  return {
    pieces: placed.map(p => ({color: p.color, name: p.name})),
    map
  };
}

   ============================================================ */
const state = {
  level: 0,
  maxReached: 0,   // highest level ever completed, loaded from profile
  totalPlayTime: 0, // cumulative play time in seconds (from profile)
  sessionStart: 0,  // timestamp when current session began
  grid: null,
  placedPieces: [], // [{color, cells:[{row,col}], idx}]
  availablePieces: [], // [Piece]
  selectedIdx: -1,
  ghostCells: null,
  ghostValid: false,
  startTime: 0,
  elapsed: 0,
  timerInterval: null,
  completed: false,
};

/* ============================================================
   Toy SDK Wrapper — graceful fallback to localStorage
   ============================================================ */
const toyAPI = {
  available: false,
  user: null, // { nickname, avatar }

  // Initialize: detect SDK support, load user profile and progress
  async init() {
    // Timeout: if SDK doesn't respond in 10s, use fallback
    const timeout = new Promise(resolve => setTimeout(() => resolve(false), 10000));
    const sdkCheck = (async () => {
      // Wait for async SDK script to finish loading (poll every 500ms, up to 10s)
      for (let i = 0; i < 20; i++) {
        if (typeof window.toy !== 'undefined' && !!window.toy) break;
        await new Promise(r => setTimeout(r, 500));
      }
      this.available = typeof window.toy !== 'undefined' && !!window.toy;
      if (this.available) {
        try { this.available = await window.toy.isSupport('getUserProfile'); } catch(e) { this.available = false; }
      }
      if (this.available) {
        try { this.user = await window.toy.getUserProfile(); } catch(e) { this.available = false; }
      }
      return this.available;
    })();
    await Promise.race([sdkCheck, timeout]);
    // Load saved progress
    if (this.available) {
      try {
        const data = await window.toy.getCloudStorage(['maxLevel','totalTime']);
        state.maxReached = parseInt(data.maxLevel || '0');
        state.totalPlayTime = parseInt(data.totalTime || '0');
      } catch(e) {}
    }
    // Always also check localStorage for backup (covers mixed sessions)
    const ls = localStorage.getItem('blockChallenge_progress');
    if (ls) {
      try {
        const p = JSON.parse(ls);
        if ((p.maxLevel || 0) > state.maxReached) state.maxReached = p.maxLevel;
        if ((p.totalTime || 0) > state.totalPlayTime) state.totalPlayTime = p.totalTime;
      } catch(e) {}
    }
  },

  // Save progress: SDK cloud + leaderboard submission + localStorage fallback
  async saveProgress(levelIdx) {
    const cleared = levelIdx + 1;
    if (cleared > state.maxReached) {
      state.maxReached = cleared;
    }
    // Save to cloud storage (SDK) + localStorage (backup)
    if (this.available) {
      try {
        await window.toy.setCloudStorage({
          maxLevel: String(state.maxReached),
          totalTime: String(state.totalPlayTime)
        });
      } catch(e) {}
      try {
        await window.toy.submitScore({ board: 1, score: state.maxReached });
      } catch(e) {}
      try {
        await window.toy.submitScore({ board: 2, score: state.totalPlayTime });
      } catch(e) {}
    }
    // Always write to localStorage as backup
    localStorage.setItem('blockChallenge_progress', JSON.stringify({
      maxLevel: state.maxReached,
      totalTime: state.totalPlayTime
    }));
    updateProgress();
  },

  // Accumulate play time (called periodically and on unload)
  accumulatePlayTime() {
    if (!state.sessionStart) return;
    const now = Date.now();
    const elapsedSec = Math.floor((now - state.sessionStart) / 1000);
    if (elapsedSec > 0) {
      state.totalPlayTime += elapsedSec;
      state.sessionStart = now;
      if (this.available) {
        try {
          window.toy.setCloudStorage({
            maxLevel: String(state.maxReached),
            totalTime: String(state.totalPlayTime)
          });
        } catch(e) {}
      }
      localStorage.setItem('blockChallenge_progress', JSON.stringify({
        maxLevel: state.maxReached,
        totalTime: state.totalPlayTime
      }));
    }
  },

  // Get leaderboard data (from SDK or localStorage)
  async getLeaderboard(tab) {
    if (this.available) {
      const board = tab === 'time' ? 2 : 1;
      try {
        return await window.toy.getRankList({ board, period: 'all', limit: 100 });
      } catch(e) {}
    }
    // Fallback: return null (use localStorage data)
    return null;
  },

  // Get user display info
  getDisplayName() {
    if (this.available && this.user) return this.user.nickname;
    return '玩家';
  },
  getAvatar() {
    if (this.available && this.user) return this.user.avatar;
    return null;
  },
  isSDK() { return this.available; },
};

function updateProfileDisplay() {
  const name = toyAPI.getDisplayName();
  const avatar = toyAPI.getAvatar();
  const el = document.getElementById('profile-name');
  if (avatar) {
    el.innerHTML = `<img src="${avatar}@20w_20h.webp" style="width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:4px"><span style="vertical-align:middle">${name}</span>`;
  } else {
    el.textContent = '👤 ' + name;
  }
  updateProgress();
}

function saveProgress(levelIdx) {
  toyAPI.saveProgress(levelIdx);
  updateProgress();
}

function accumulatePlayTime() {
  toyAPI.accumulatePlayTime();
}

function updateProgress() {
  document.getElementById('progress-display').textContent =
    `已过 ${state.maxReached}/${LEVELS.length} 关`;
}

   ============================================================ */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
let CELL = 0, boardPad = 0, boardX = 0, boardY = 0;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = Math.min(rect.width - 16, 420);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CELL = size / (GRID + 2);
  boardPad = CELL;
  boardX = boardPad;
  boardY = boardPad;
}

function rdRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawBoard() {
  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, w, h);
  const gap = 1;
  const sz = CELL - gap * 2;

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID; i++) {
    const x = boardX + i * CELL, y = boardY + i * CELL;
    ctx.beginPath(); ctx.moveTo(x, boardY); ctx.lineTo(x, boardY + GRID * CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(boardX, y); ctx.lineTo(boardX + GRID * CELL, y); ctx.stroke();
  }

  const level = LEVELS[state.level];

  // Draw cells
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const x = boardX + c * CELL + gap;
      const y = boardY + r * CELL + gap;
      const placed = state.grid[r][c];
      const isActive = level.map[r][c] === 1;

      if (placed) {
        // Placed piece cell
        drawCell(x, y, sz, COLOR_HEX[placed.color], COLOR_GLOW[placed.color], false, 1);
      } else if (isActive) {
        // Empty active cell — bright enough to see clearly
        drawCell(x, y, sz, '#3a3a70', 'rgba(100,130,255,0.25)', true, 1);
      } else {
        // Inactive
        drawCell(x, y, sz, '#0a0a14', 'transparent', false, 1);
      }
    }
  }

  // Ghost preview — white glow to mark the piece's position during drag
  if (state.dragCells && !state.completed) {
    for (const {row, col} of state.dragCells) {
      const x = boardX + col * CELL + gap;
      const y = boardY + row * CELL + gap;
      if (state.dragValid) {
        ctx.shadowColor = 'rgba(255,255,255,0.6)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        rdRect(ctx, x, y, sz, sz, sz*0.1); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        rdRect(ctx, x, y, sz, sz, sz*0.1); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(255,68,68,0.12)';
        rdRect(ctx, x, y, sz, sz, sz*0.1); ctx.fill();
        ctx.strokeStyle = 'rgba(255,68,68,0.5)';
        ctx.lineWidth = 2;
        rdRect(ctx, x, y, sz, sz, sz*0.1); ctx.stroke();
      }
    }
  }

  // Completion green glow
  if (state.completed) {
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        if (level.map[r][c]) {
          const x = boardX + c * CELL + gap;
          const y = boardY + r * CELL + gap;
          ctx.shadowColor = 'rgba(68,255,136,0.3)';
          ctx.shadowBlur = 12;
          ctx.strokeStyle = 'rgba(68,255,136,0.4)';
          ctx.lineWidth = 1.5;
          rdRect(ctx, x, y, sz, sz, sz*0.1);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }
    }
  }
}

function drawCell(x, y, sz, fill, glow, border, alpha) {
  ctx.globalAlpha = alpha;
  ctx.shadowColor = glow;
  ctx.shadowBlur = glow !== 'transparent' ? 6 : 0;
  ctx.fillStyle = fill;
  rdRect(ctx, x, y, sz, sz, sz * 0.1);
  ctx.fill();
  ctx.shadowBlur = 0;
  if (border) {
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 0.5;
    rdRect(ctx, x, y, sz, sz, sz * 0.1);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   Palette rendering
   ============================================================ */

function drawPiecePreview(btn, piece) {
  const col = piece.color;
  const cells = piece.cells;
  const maxR = Math.max(...cells.map(c => c[0]));
  const maxC = Math.max(...cells.map(c => c[1]));
  const cs = 11;
  const pw = (maxC + 1) * cs + 4;
  const ph = (maxR + 1) * cs + 4;
  const ox = Math.floor((64 - pw) / 2);
  const oy = Math.floor((56 - ph) / 2);
  for (const [r, c] of cells) {
    const div = document.createElement("div");
    div.style.cssText = [
      "position:absolute",
      "left:" + (ox + c * cs + 2) + "px",
      "top:" + (oy + r * cs + 2) + "px",
      "width:" + (cs - 2) + "px",
      "height:" + (cs - 2) + "px",
      "background:" + COLOR_HEX[col],
      "border-radius:2px",
      "box-shadow:0 0 5px " + COLOR_GLOW[col],
    ].join(";");
    btn.appendChild(div);
  }
}

function renderPalette() {
  const container = document.getElementById("palette-pieces");
  container.innerHTML = "";
  if (!state.availablePieces.length) {
    container.innerHTML = '<span style="color:rgba(255,255,255,0.2);font-size:13px;">✓ 全部放好啦!</span>';
    return;
  }
  state.availablePieces.forEach((piece, idx) => {
    const btn = document.createElement("div");
    btn.className = "piece-btn" + (state.dragIdx === idx ? " selected" : "");
    btn.style.cssText = "position:relative;width:64px;height:56px;";
    drawPiecePreview(btn, piece);
    btn.addEventListener("pointerdown", function(e) {
      if (e.pointerType !== 'touch' && e.pointerType !== 'mouse') return;
      e.preventDefault();
      if (state.completed) return;
      state.dragIdx = idx;
      dragPtr.active = true;
      dragPtr.x = e.clientX; dragPtr.y = e.clientY;
      dragPtr.idx = idx;
      btn.setPointerCapture(e.pointerId);
      renderPalette();
    });
    container.appendChild(btn);
  });
  // Sync rotate button highlight
  const rb = document.getElementById('btn-rotate');
  if (state.dragIdx >= 0 && !state.completed && state.availablePieces.length) {
    rb.classList.add('active');
  } else {
    rb.classList.remove('active');
  }
  // Sync reset button highlight — active when pieces have been placed
  const resetBtn = document.getElementById('btn-reset');
  if (state.placedPieces.length > 0 && !state.completed) {
    resetBtn.classList.add('active');
  } else {
    resetBtn.classList.remove('active');
  }
  // Sync undo button highlight — same logic as reset
  const undoBtn = document.getElementById('btn-undo');
  if (state.placedPieces.length > 0 && !state.completed) {
    undoBtn.classList.add('active');
  } else {
    undoBtn.classList.remove('active');
  }
}


function initLevel(idx) {
  stopTimer();
  state.level = idx;
  state.grid = Array.from({length: GRID}, () => Array(GRID).fill(null));
  state.placedPieces = [];
  state.dragIdx = -1;
  state.dragCells = null;
  state.completed = false;
  dragPtr.active = false;

  const lvl = LEVELS[idx];
  state.availablePieces = lvl.pieces.map(pd => {
    const def = getDef(pd.color, pd.name);
    return new Piece(pd.color, def.cells.map(c => [...c]), pd.name);
  });

  document.getElementById('level-display').textContent = idx + 1;
  renderPalette();
  resize();
  drawBoard();
  state.startTime = Date.now();
  startTimer();
}

function tryPlace(idx, row, col) {
  if (idx < 0 || state.completed) return false;
  const piece = state.availablePieces[idx];
  const lvl = LEVELS[state.level];
  const absCells = [];
  for (const [pr, pc] of piece.cells) {
    const ar = row + pr, ac = col + pc;
    if (ar < 0 || ar >= GRID || ac < 0 || ac >= GRID) return false;
    if (lvl.map[ar][ac] !== 1) return false;
    if (state.grid[ar][ac] !== null) return false;
    absCells.push({row: ar, col: ac});
  }
  state.placedPieces.push({
    color: piece.color, name: piece.name,
    origCells: piece._cells.map(c => [...c]),
    cells: absCells,
  });
  for (const {row, col} of absCells) state.grid[row][col] = { color: piece.color };
  state.availablePieces.splice(idx, 1);
  state.dragIdx = -1;
  state.dragCells = null;

  let done = true;
  for (let r = 0; r < GRID && done; r++)
    for (let c = 0; c < GRID && done; c++)
      if (lvl.map[r][c] === 1 && state.grid[r][c] === null) done = false;
  if (done) {
    state.completed = true; stopTimer();
    state.elapsed = Date.now() - state.startTime;
    showCompletion();
  }
  renderPalette();
  drawBoard();
  return true;
}

function undoLast() {
  if (!state.placedPieces.length || state.completed) return;
  const last = state.placedPieces.pop();
  for (const {row, col} of last.cells) state.grid[row][col] = null;
  state.availablePieces.push(new Piece(last.color, last.origCells.map(c => [...c]), last.name));
  state.dragIdx = -1;
  state.dragCells = null;
  renderPalette();
  drawBoard();
}
/* ============================================================
   Completion overlay
   ============================================================ */
function showCompletion() {
  const ms = state.elapsed;
  const secs = Math.floor(ms / 1000);
  const mins = Math.floor(secs / 60);
  const s = secs % 60;
  const timeStr = `${mins}:${String(s).padStart(2,'0')}`;
  const isLast = state.level >= LEVELS.length - 1;

  // Accumulate play time and save to profile
  accumulatePlayTime();
  saveProgress(state.level);  // persist highest cleared level

  if (isLast) {
    showOverlay(
      '🎉',
      `第 ${state.level + 1} 关 · 通关！`,
      '所有积木全部拼好！',
      `⏱ ${timeStr} · 🧩 ${state.placedPieces.length} 块`,
      '全部 100 关通关！',
      '🏆 查看排行榜',
      () => { hideOverlay(); showLeaderboard('time'); }
    );
  } else {
    showOverlay(
      '🎉',
      `第 ${state.level + 1} 关 · 通关！`,
      '所有积木全部拼好！',
      `⏱ ${timeStr} · 🧩 ${state.placedPieces.length} 块`,
      `即将进入第 ${state.level + 2} 关`,
      '下一关 →',
      () => { nextLevel(); }
    );
  }
}

function showOverlay(emoji, title, desc, stats, sub, btnText, btnFn, cancelText, cancelFn) {
  document.getElementById('ov-emoji').textContent = emoji;
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-desc').textContent = desc;
  const st = document.getElementById('ov-stats');
  st.style.display = stats ? 'block' : 'none';
  st.textContent = stats || '';
  document.getElementById('ov-sub').textContent = sub || '';
  const btn = document.getElementById('ov-btn');
  btn.textContent = btnText;
  btn.onpointerdown = (e) => { e.preventDefault(); btnFn(); };
  window._ovBtnFn = btnFn;
  const cbtn = document.getElementById('ov-btn-cancel');
  if (cancelText) {
    cbtn.textContent = cancelText;
    cbtn.style.display = 'block';
    cbtn.onpointerdown = (e) => { e.preventDefault(); cancelFn(); };
  } else {
    cbtn.style.display = 'none';
  }
  document.getElementById('overlay').classList.add('show');
}

function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }

function nextLevel() {
  hideOverlay();
  const next = state.level + 1;
  if (next < LEVELS.length && next <= state.maxReached) {
    initLevel(next);
  } else {
    showOverlay('🔒', '已通关全部关卡！', '你已经完成了所有挑战', '', '', '🏆 重头再来', () => { hideOverlay(); initLevel(0); });
  }
}

/* ============================================================
   Timer
   ============================================================ */
function startTimer() {
  stopTimer();
  state.startTime = Date.now();
  state.timerInterval = setInterval(() => {
    const ms = Date.now() - state.startTime;
    const secs = Math.floor(ms / 1000);
    const s = secs % 60, m = Math.floor(secs / 60);
    document.getElementById('timer-display').textContent = `${m}:${String(s).padStart(2,'0')}`;
  }, 200);
}
function stopTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
}

/* ============================================================
   Ghost preview
   ============================================================ */
function getGhost(idx, row, col) {
  if (idx < 0 || state.completed) return null;
  const piece = state.availablePieces[idx];
  if (!piece) return null;
  const lvl = LEVELS[state.level];
  const cells = [];
  let valid = true;
  for (const [pr, pc] of piece.cells) {
    const ar = row + pr, ac = col + pc;
    if (ar < 0 || ar >= GRID || ac < 0 || ac >= GRID) { valid = false; continue; }
    if (lvl.map[ar][ac] !== 1 || state.grid[ar][ac] !== null) { valid = false; }
    cells.push({row: ar, col: ac});
  }
  return { cells, valid };
}

/* ============================================================
   Grid position from pointer coords
   ============================================================ */
function gridFromPoint(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scale = (canvas.width / (window.devicePixelRatio || 1)) / rect.width;
  const cx = clientX - rect.left;
  const cy = clientY - rect.top;
  const col = Math.floor((cx * scale - boardX) / CELL);
  const row = Math.floor((cy * scale - boardY) / CELL);
  if (row >= 0 && row < GRID && col >= 0 && col < GRID) return {row, col};
  return null;
}

/* ============================================================
   Drag system (pointer tracking across page)
   ============================================================ */
function handlePointerMove(clientX, clientY) {
  if (state.dragIdx < 0 || !dragPtr.active) return;
  dragPtr.x = clientX;
  dragPtr.y = clientY;
  const pos = gridFromPoint(clientX, clientY);
  if (pos) {
    // Cursor is over the board — show ghost at exact position
    const g = getGhost(state.dragIdx, pos.row, pos.col);
    state.dragCells = g ? g.cells : null;
    state.dragValid = g ? g.valid : false;
  } else {
    // Cursor is outside the board — clamp to nearest edge cell so ghost still shows
    const rect = canvas.getBoundingClientRect();
    const scale = (canvas.width / (window.devicePixelRatio || 1)) / rect.width;
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    let col = Math.floor((cx * scale - boardX) / CELL);
    let row = Math.floor((cy * scale - boardY) / CELL);
    col = Math.max(0, Math.min(GRID - 1, col));
    row = Math.max(0, Math.min(GRID - 1, row));
    const g = getGhost(state.dragIdx, row, col);
    state.dragCells = g ? g.cells : null;
    state.dragValid = false; // outside board = can't place
  }
  drawBoard();
}

function handlePointerUp(clientX, clientY) {
  if (state.dragIdx < 0) return;
  const pos = gridFromPoint(clientX, clientY);
  if (pos) {
    const g = getGhost(state.dragIdx, pos.row, pos.col);
    if (g && g.valid) {
      tryPlace(state.dragIdx, pos.row, pos.col);
      dragPtr.active = false;
      return;
    }
    // Invalid drop - flash red, keep piece selected
    state.dragCells = g ? g.cells : null;
    state.dragValid = false;
    drawBoard();
    setTimeout(() => { state.dragCells = null; drawBoard(); }, 250);
  }
  // Keep piece selected for rotate; stop active dragging
  dragPtr.active = false;
  state.dragCells = null;
  renderPalette();
  drawBoard();
}

// Pointer events — unified mouse + touch handling
document.addEventListener("pointermove", (e) => {
  if (state.dragIdx < 0 || !dragPtr.active) return;
  handlePointerMove(e.clientX, e.clientY);
});

document.addEventListener("pointerup", (e) => {
  if (state.dragIdx < 0) return;
  handlePointerUp(e.clientX, e.clientY);
});

// Start dragging from board when a piece is already selected
canvas.addEventListener("pointerdown", function(e) {
  if (e.pointerType !== 'touch' && e.pointerType !== 'mouse') return;
  if (state.dragIdx >= 0 && !dragPtr.active && !state.completed) {
    e.preventDefault();
    dragPtr.active = true;
    dragPtr.x = e.clientX; dragPtr.y = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    handlePointerMove(e.clientX, e.clientY);
  }
});
/* ============================================================
   Button events
   ============================================================ */
function handleRotate() {
  if (state.dragIdx < 0 || state.completed) return;
  state.availablePieces[state.dragIdx].rotate();
  state.dragCells = null;
  renderPalette(); drawBoard();
}
function handleReset() {
  showOverlay(
    '🔄', '重新开始？',
    '当前关卡的进度将会丢失',
    '', '',
    '确定重开',
    () => { hideOverlay(); initLevel(state.level); },
    '取消',
    hideOverlay
  );
}
// Use pointerdown instead of click for reliable mobile tap response
document.getElementById('btn-rotate').addEventListener('pointerdown', (e) => { e.preventDefault(); handleRotate(); });
document.getElementById('btn-undo').addEventListener('pointerdown', (e) => { e.preventDefault(); undoLast(); });
document.getElementById('btn-reset').addEventListener('pointerdown', (e) => { e.preventDefault(); handleReset(); });

/* ============================================================
   Keyboard shortcuts
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') handleRotate();
  if (e.key === 'z' || e.key === 'Z') undoLast();
  if (e.key === 'Escape') {
    state.dragIdx = -1; state.dragCells = null; dragPtr.active = false;
    renderPalette(); drawBoard();
  }
  if (e.key === 'Enter' && document.getElementById('overlay').classList.contains('show')) {
    if (window._ovBtnFn) window._ovBtnFn();
  }
});

/* ============================================================
   Resize
   ============================================================ */
window.addEventListener('resize', () => { resize(); drawBoard(); });

/* ============================================================
   Leaderboard — ranks all profiles by play time or levels
   ============================================================ */
let currentLbTab = 'time';

function formatTime(totalSec) {
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}时${m}分`;
  return `${m}分${s}秒`;
}

function renderLeaderboard(tab) {
  currentLbTab = tab;
  document.getElementById('lb-tab-time').classList.toggle('active', tab === 'time');
  document.getElementById('lb-tab-level').classList.toggle('active', tab === 'levels');

  const container = document.getElementById('lb-content');
  container.innerHTML = '<div class="lb-empty">加载中…</div>';

  // Try SDK first
  toyAPI.getLeaderboard(tab).then(sdkList => {
    let sorted, myNickname, isSDK;

    if (sdkList && sdkList.length > 0) {
      // SDK data — already sorted by server
      sorted = sdkList;
      myNickname = toyAPI.isSDK() ? toyAPI.getDisplayName() : '';
      isSDK = true;
    } else {
      // Fallback: localStorage
      const ls = localStorage.getItem('blockChallenge_progress');
      const myData = ls ? JSON.parse(ls) : null;
      const localList = [];
      if (myData && (myData.maxLevel > 0 || myData.totalTime > 0)) {
        localList.push({
          nickname: toyAPI.getDisplayName() || '玩家',
          avatar: '',
          score: tab === 'levels' ? myData.maxLevel : myData.totalTime
        });
      }
      sorted = localList;
      myNickname = toyAPI.getDisplayName();
      isSDK = false;
    }

    const rankClass = ['', 'lb-rank-1', 'lb-rank-2', 'lb-rank-3'];
    const rows = sorted.map((r, i) => {
      const score = r.score || 0;
      const rc = i < 3 ? rankClass[i + 1] : '';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
      const isMe = isSDK ? (r.nickname === myNickname) : (i === 0);
      const nameStyle = isMe ? 'color:#ffd93d;font-weight:600' : '';
      const avatarHtml = r.avatar ? `<img src="${r.avatar}@24w_24h.webp" style="width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:6px">` : '';
      let scoreStr;
      if (tab === 'levels') {
        scoreStr = score + ' 关';
      } else {
        // score is totalTime in seconds for time ranking
        scoreStr = formatTime(score);
      }
      return `<tr>
        <td class="${rc}">${medal}</td>
        <td>${avatarHtml}<span style="${nameStyle}">${r.nickname || '匿名'}</span></td>
        <td style="text-align:center">${scoreStr}</td>
      </tr>`;
    }).join('');

    if (sorted.length === 0) {
      container.innerHTML = '<div class="lb-empty">还没有玩家记录</div>';
      return;
    }

    if (tab === 'levels') {
      container.innerHTML = `<table class="lb-table">
        <thead><tr><th></th><th>玩家</th><th style="text-align:center">过关</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    } else {
      container.innerHTML = `<table class="lb-table">
        <thead><tr><th></th><th>玩家</th><th style="text-align:center">游玩时间</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }
  });
}

function showLeaderboard(tab) {
  renderLeaderboard(tab || currentLbTab);
  document.getElementById('lb-overlay').classList.add('show');
}

function hideLeaderboard() {
  document.getElementById('lb-overlay').classList.remove('show');
}

/* ============================================================
   Local Profile Fallback (when Toy SDK is unavailable)
   ============================================================ */
let currentPlayerName = '';

function setActiveName(name) {
  try { localStorage.setItem('blockChallenge_activeProfile', name); } catch(e) {}
}
function getActiveName() {
  try { return localStorage.getItem('blockChallenge_activeProfile') || ''; } catch(e) { return ''; }
}

function getProfiles() {
  try { return JSON.parse(localStorage.getItem('blockChallenge_profiles') || '[]'); } catch(e) { return []; }
}
function saveProfiles(list) {
  try { localStorage.setItem('blockChallenge_profiles', JSON.stringify(list)); } catch(e) {}
}
function getCurrentProfile() {
  const profiles = getProfiles();
  return profiles.find(p => p.name === currentPlayerName) || null;
}
function upsertProfile(name, updates) {
  const profiles = getProfiles();
  const idx = profiles.findIndex(p => p.name === name);
  if (idx >= 0) {
    profiles[idx] = { ...profiles[idx], ...updates, name };
  } else {
    profiles.push({ name, totalTime: 0, maxLevel: 0, date: new Date().toISOString(), ...updates });
  }
  saveProfiles(profiles);
}
function deleteProfile(name) {
  let profiles = getProfiles();
  profiles = profiles.filter(p => p.name !== name);
  saveProfiles(profiles);
}

/* ============================================================
   Profile Management UI
   ============================================================ */
function renderProfileList() {

  document.getElementById('profile-add').style.display = 'block';
  const profiles = getProfiles();
  const rows = profiles.map(p => {
    const active = p.name === currentPlayerName;
    const cls = active ? 'profile-item active' : 'profile-item';
    const timeStr = formatTime(p.totalTime || 0);
    return `<div class="${cls}" data-name="${p.name}">
      <span class="pi-name">${active ? '✓ ' : ''}${p.name}</span>
      <span class="pi-stats">${p.maxLevel || 0}关 · ${timeStr}</span>
      ${profiles.length > 1 ? '<span class="pi-del" data-del="${p.name}">✕</span>' : ''}
    </div>`;
  }).join('');
  container.innerHTML = rows || '<div class="lb-empty">暂无玩家</div>';

  container.querySelectorAll('.profile-item').forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      if (e.target.classList.contains('pi-del')) return;
      e.preventDefault();
      const name = el.dataset.name;
      if (name !== currentPlayerName) {
        switchProfile(name);
      }
    });
  });
  container.querySelectorAll('.pi-del').forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      const name = el.dataset.del;
      if (confirm(`确定删除玩家「${name}」的所有记录吗？`)) {
        deleteProfile(name);
        if (name === currentPlayerName) {
          const remaining = getProfiles();
          if (remaining.length > 0) {
            switchProfile(remaining[0].name);
          } else {
            const newName = '玩家1';
            upsertProfile(newName, { maxLevel: 0, totalTime: 0 });
            switchProfile(newName);
          }
        }
        renderProfileList();
      }
    });
  });
}function switchProfile(name) {
  // Save current session time before switching
  accumulatePlayTime();
  currentPlayerName = name;
  setActiveName(name);
  const p = getCurrentProfile();
  state.maxReached = p ? p.maxLevel || 0 : 0;
  state.totalPlayTime = p ? p.totalTime || 0 : 0;
  state.sessionStart = Date.now();
  updateProfileDisplay();
  hideProfileOverlay();
  hideOverlay(); // close any open overlays (welcome, completion, etc.)
  initLevel(0);
}

function showProfileOverlay() {
  renderProfileList();
  document.getElementById('profile-overlay').classList.add('show');
}

function hideProfileOverlay() {
  document.getElementById('profile-overlay').classList.remove('show');
}

function createNewProfile() {
  const name = prompt('输入新玩家名称：');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (getProfiles().some(p => p.name === trimmed)) {
    alert('该名称已存在！');
    return;
  }
  accumulatePlayTime(); // save current session
  upsertProfile(trimmed, { maxLevel: 0, totalTime: 0 });
  switchProfile(trimmed);
  renderProfileList();
}

/* ============================================================
   Init
   ============================================================ */
function init(){
  state.sessionStart = Date.now();
  setInterval(accumulatePlayTime, 30000);
  window.addEventListener('beforeunload', () => { accumulatePlayTime(); });

  resize();
  updateProfileDisplay();
  
  // Show overlay immediately with default "开始挑战"
  showOverlay(
    '🧩',
    '积木大比拼',
    '用不同形状的积木块\n填满亮光的棋盘区域',
    '',
    '共 100 关 · 由易到难\n拖拽积木到棋盘上放置\n⬜ 白框 = 可放置  🟥 红框 = 不可放',
    '加载中…',
    () => {}
  );

  // Load SDK data and progress in background (non-blocking)
  toyAPI.init().then(() => {
    // If SDK not available, set up fallback localStorage profile
    if (!toyAPI.isSDK()) {
      let lsName = localStorage.getItem('blockChallenge_activeProfile') || '';
      const profiles = getProfiles();
      if (!lsName || !profiles.some(p => p.name === lsName)) {
        lsName = profiles.length > 0 ? profiles[0].name : '';
        if (!lsName) { lsName = '玩家1'; upsertProfile(lsName, { maxLevel: 0, totalTime: 0 }); }
        localStorage.setItem('blockChallenge_activeProfile', lsName);
      }
      currentPlayerName = lsName;
      const p = getCurrentProfile();
      if (p) {
        if (p.maxLevel > state.maxReached) state.maxReached = p.maxLevel;
        if (p.totalTime > state.totalPlayTime) state.totalPlayTime = p.totalTime;
      }
    }
    updateProfileDisplay();
    
    // Update overlay with correct resume point
    const resumeLevel = state.maxReached; // maxReached = number of cleared levels
    if (resumeLevel > 0) {
      showOverlay(
        '🧩',
        '积木大比拼',
        '用不同形状的积木块\n填满亮光的棋盘区域',
        '已解锁 ' + resumeLevel + '/' + LEVELS.length + ' 关',
        '共 100 关 · 由易到难\n拖拽积木到棋盘上放置\n⬜ 白框 = 可放置  🟥 红框 = 不可放',
        '继续挑战→第' + (resumeLevel + 1) + '关',
        () => { hideOverlay(); initLevel(resumeLevel < LEVELS.length ? resumeLevel : 0); }
      );
    } else {
      showOverlay(
        '🧩',
        '积木大比拼',
        '用不同形状的积木块\n填满亮光的棋盘区域',
        '',
        '共 100 关 · 由易到难\n拖拽积木到棋盘上放置\n⬜ 白框 = 可放置  🟥 红框 = 不可放',
        '开始挑战！',
        () => { hideOverlay(); initLevel(0); }
      );
    }
  }).catch(() => {
    // If SDK init fails, just keep default state
    updateProfileDisplay();
    showOverlay(
      '🧩',
      '积木大比拼',
      '用不同形状的积木块\n填满亮光的棋盘区域',
      '',
      '共 100 关 · 由易到难\n拖拽积木到棋盘上放置\n⬜ 白框 = 可放置  🟥 红框 = 不可放',
      '开始挑战！',
      () => { hideOverlay(); initLevel(0); }
    );
  });
}

// Leaderboard button
document.getElementById('lb-badge').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  showLeaderboard('time');
});
// Profile overlay: add new player
document.getElementById('profile-add').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  createNewProfile();
});

// Profile overlay: close
document.getElementById('profile-close').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  hideProfileOverlay();
});
document.getElementById('profile-overlay').addEventListener('pointerdown', (e) => {
  if (e.target === document.getElementById('profile-overlay')) hideProfileOverlay();
});

// Leaderboard tab switching
document.getElementById('lb-tab-time').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  renderLeaderboard('time');
});
document.getElementById('lb-tab-level').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  renderLeaderboard('levels');
});

// Leaderboard close
document.getElementById('lb-close').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  hideLeaderboard();
});

// Close leaderboard on backdrop click
document.getElementById('lb-overlay').addEventListener('pointerdown', (e) => {
  if (e.target === document.getElementById('lb-overlay')) {
    hideLeaderboard();
  }
});

init();
window.__game = { state, LEVELS, PIECE_DEFS, reset: () => initLevel(state.level) };
</script>
